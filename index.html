<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mapa de Minas Gerais</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  /* O mapa cobre 100% do iframe — o iframe é que se ajusta ao visual */
  #map {
    position: absolute;
    inset: 0;                 /* top/right/bottom/left = 0 */
    background: transparent;
  }

  .leaflet-container {
    background: transparent !important;
    font-family: 'Segoe UI', sans-serif;
  }

  /* Rótulos das cidades — sombra branca para legibilidade sobre o mapa */
  .lbl {
    font-size: 6px;
    font-weight: 700;
    color: #1A2940;
    white-space: nowrap;
    background: transparent;
    border: none;
    box-shadow: none;
    text-shadow:
      0 0  2px #fff, 0 0 2px #fff,
      1px 1px 2px #fff, -1px -1px 2px #fff;
    pointer-events: none;
  }

  /* Mensagem de carregamento / erro — evita tela branca silenciosa */
  #status {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    font-family: 'Segoe UI', sans-serif;
    color: #6B7E99;
    font-size: 13px;
    z-index: 500;
    pointer-events: none;
  }
  #status.hidden { display: none; }
  .spinner {
    width: 24px; height: 24px;
    border: 3px solid #DDE4EC;
    border-top-color: #0F2549;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="map"></div>
<div id="status"><div class="spinner"></div><span>Carregando mapa de Minas Gerais…</span></div>

<script>
(function () {
  var GEOJSON_URL =
    'https://raw.githubusercontent.com/tbrugz/geodata-br/master/geojson/geojs-31-mun.json';

  var statusEl = document.getElementById('status');
  var bounds = null;

  // Mapa estático (sem zoom/drag) — comporta-se como imagem vetorial
  var map = L.map('map', {
    zoomControl: false,
    attributionControl: false,
    dragging: false,
    scrollWheelZoom: false,
    doubleClickZoom: false,
    boxZoom: false,
    keyboard: false,
    tap: false,
    zoomSnap: 0.1            // permite ajuste fino do enquadramento
  });

  // ── Reajuste em qualquer mudança de tamanho do visual ──────────
  // ResizeObserver capta redimensionamento do iframe em tempo real.
  function reenquadrar() {
    if (!bounds) return;
    map.invalidateSize({ animate: false });
    map.fitBounds(bounds, { padding: [10, 10], animate: false });
  }

  if (window.ResizeObserver) {
    new ResizeObserver(reenquadrar).observe(document.getElementById('map'));
  }
  window.addEventListener('resize', reenquadrar);

  // ── Carregamento do GeoJSON (uma única vez) ────────────────────
  fetch(GEOJSON_URL)
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (geo) {
      var layer = L.geoJSON(geo, {
        style: {
          color: '#0F2549',        // contorno navy
          weight: 0.6,
          fillColor: '#3B6EA5',    // preenchimento azul translúcido
          fillOpacity: 0.08
        }
      }).addTo(map);

      bounds = layer.getBounds();
      map.fitBounds(bounds, { padding: [10, 10], animate: false });

      // Rótulos no centro de cada município
      geo.features.forEach(function (f) {
        var nome = (f.properties && (f.properties.name || f.properties.NM_MUN)) || '';
        if (!nome) return;
        var c = L.geoJSON(f).getBounds().getCenter();
        L.marker(c, {
          icon: L.divIcon({ className: 'lbl', html: nome, iconSize: null }),
          interactive: false,
          keyboard: false
        }).addTo(map);
      });

      statusEl.classList.add('hidden');
      // Garante enquadramento após o layout estabilizar
      setTimeout(reenquadrar, 200);
    })
    .catch(function (err) {
      statusEl.innerHTML =
        '<span style="color:#B23A48">Não foi possível carregar o mapa.</span>' +
        '<span style="font-size:11px">Verifique o acesso à internet do relatório.</span>';
      console.error('Falha ao carregar GeoJSON:', err);
    });
})();
</script>
</body>
</html>
