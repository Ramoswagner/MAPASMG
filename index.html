<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mapa de Minas Gerais</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 100%; height: 100%; overflow: hidden; }
  body { width: 100%; height: 100%; overflow: hidden; background: transparent; position: relative; }
  #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent; }
  .leaflet-container { background: transparent !important; font-family: 'Segoe UI', sans-serif; }
  .lbl-capital {
    font-size: 10px; font-weight: 800; color: #0F2549;
    white-space: nowrap; background: transparent; border: none; box-shadow: none;
    text-shadow: 0 0 4px #fff, 0 0 4px #fff, 0 0 4px #fff;
    pointer-events: none; letter-spacing: 0.3px;
  }
  .lbl-cidade {
    font-size: 9px; font-weight: 700; color: #0F2549;
    white-space: nowrap; background: transparent; border: none; box-shadow: none;
    text-shadow: 0 0 3px #fff, 0 0 3px #fff;
    pointer-events: none;
  }
  .tooltip-mapa {
    background: rgba(15,37,73,0.92); color: #fff;
    border: 1px solid #C9A84C; border-radius: 6px;
    padding: 6px 10px; font-family: 'Segoe UI', sans-serif; font-size: 12px;
    pointer-events: none;
  }
  .tooltip-mapa strong { color: #C9A84C; display: block; margin-bottom: 2px; }
  #status {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 8px;
    font-family: 'Segoe UI', sans-serif; color: #6B7E99; font-size: 13px;
    z-index: 500; pointer-events: none;
  }
  #status.hidden { display: none; }
  .spinner {
    width: 24px; height: 24px;
    border: 3px solid #DDE4EC; border-top-color: #0F2549;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="map"></div>
<div id="status"><div class="spinner"></div><span>Carregando mapa…</span></div>
<script>
(function () {
  var GEOJSON_URL = 'https://raw.githubusercontent.com/tbrugz/geodata-br/master/geojson/geojs-31-mun.json';

  var BALEIA_ICON = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABwAAAAcCAMAAABF0y+mAAAAZlBMVEVHcEz////////s7PL////U1eDn6O+io7n5+fy0tce7vM3R097///////+rrcDv8PT///8hKGP///8QGVwCClcbImEuM2tsb5KGiKTy8vZdYIiVl6+kprve3+dBRnZ8fp1NUX68vs3GmHzGAAAAEXRSTlMAVQ6FIqKY723lwMI7L9XBRmfxff4AAAFcSURBVCiRdZLZYoQgDEXdEUdtgYTV9f9/skEcx5m2ecIcTG4uybIr+rJjjI11W2Sf0bJNpdD2Ub2himthjFYihlJrc2O5hdBWVbkqgYiE9ePFDKzDcfDKW0+lQX89a1pQ9Xmt7ouhZpZddTkI3f5SeOpcqMt/kH4Uz7KfMfioPvwNSzRU9p+mnQ40u2KvTNHWXd0fx9HvhzGX+NJqmtQfNjAzQ+yabCCPk4mIkTIvMX4BJ7tzviR/iS557CntkVArZxvgyYSCLstqkA7SXaUuhDgZ0pjrXU4g3gNxlnakpsFIaeCWjzVmKY/RG5gTxaSDJhGUmda4LkXYJJ1Bb5qgngwYJ6XD5nyWQHQ2JFABgKHfpNz46UmjJuloAcw+TbuLSHp7LdlDBBIMKU/hFtvfnob8VesTBeT35Ww0Iph9dm7eDdry7U01qIUzs+nF2/Fj5dvAOrK5GL77e70f0YUhtbcwQnAAAAAASUVORK5CYII=';

  // Coordenadas do Hospital da Baleia
  var HOSPITAL_LAT = -19.9227;
  var HOSPITAL_LNG = -43.9451;

  function makePinSVG(size, color, borderColor, iconBase64) {
    var imgSize = Math.round(size * 0.55);
    var imgOffset = Math.round((size - imgSize) / 2);
    return '<svg width="' + size + '" height="' + Math.round(size * 1.3) + '" viewBox="0 0 ' + size + ' ' + Math.round(size*1.3) + '" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">' +
      '<defs><clipPath id="c' + size + '"><circle cx="' + (size/2) + '" cy="' + (size/2) + '" r="' + (size/2 - 2) + '"/></clipPath></defs>' +
      '<path d="M' + (size/2) + ' 1 C' + (size*0.15) + ' 1 1 ' + (size*0.35) + ' 1 ' + (size/2) + ' C1 ' + (size*0.78) + ' ' + (size/2) + ' ' + Math.round(size*1.28) + ' ' + (size/2) + ' ' + Math.round(size*1.28) + ' C' + (size/2) + ' ' + Math.round(size*1.28) + ' ' + (size-1) + ' ' + (size*0.78) + ' ' + (size-1) + ' ' + (size/2) + ' C' + (size-1) + ' ' + (size*0.35) + ' ' + (size*0.85) + ' 1 ' + (size/2) + ' 1Z" ' +
      'fill="' + color + '" stroke="' + borderColor + '" stroke-width="1.5"/>' +
      '<image x="' + imgOffset + '" y="' + imgOffset + '" width="' + imgSize + '" height="' + imgSize + '" href="' + iconBase64 + '" clip-path="url(#c' + size + ')"/>' +
      '</svg>';
  }

  function makePinIcon(size, color, borderColor) {
    return L.divIcon({
      className: '',
      html: makePinSVG(size, color, borderColor, BALEIA_ICON),
      iconSize:   [size, Math.round(size * 1.3)],
      iconAnchor: [size / 2, Math.round(size * 1.3)]
    });
  }

  // Pin Hospital da Baleia — azul escuro, maior
  var PIN_HOSPITAL = makePinIcon(36, '#0F2549', '#071628');
  // Pin cidades — azul médio, menor (tamanho varia com atendimentos)
  function getPinCidade(t) {
    var size = Math.round(14 + t * 16); // 14px a 30px
    return makePinIcon(size, '#3B7EC8', '#1E4A7A');
  }

  var map = L.map('map', {
    zoomControl: false, attributionControl: false,
    dragging: false, scrollWheelZoom: false,
    doubleClickZoom: false, boxZoom: false,
    keyboard: false, tap: false, zoomSnap: 0.1
  });

  var bounds      = null;
  var geoCache    = null;
  var geoLayer    = null;
  var pinLayer    = null;
  var labelLayer  = null;
  var statusEl    = document.getElementById('status');

  function reenquadrar() {
    if (!bounds) return;
    map.invalidateSize({ animate: false });
    map.fitBounds(bounds, { padding: [8, 8], animate: false });
  }

  if (window.ResizeObserver) {
    new ResizeObserver(reenquadrar).observe(document.getElementById('map'));
  }
  window.addEventListener('resize', reenquadrar);

  function buildAtendMap(dados) {
    var m = {};
    if (!dados) return m;
    dados.forEach(function(d) {
      if (d.cidade) m[d.cidade.toUpperCase().trim()] = Number(d.atend) || 0;
    });
    return m;
  }

  function fmt(n) { return Number(n).toLocaleString('pt-BR'); }

  var centroidCache = {};
  function getCentroid(feature) {
    var nome = (feature.properties.name || '').toUpperCase().trim();
    if (centroidCache[nome]) return centroidCache[nome];
    var c = L.geoJSON(feature).getBounds().getCenter();
    centroidCache[nome] = c;
    return c;
  }

  function renderMapa(dadosPBI) {
    if (!geoCache) return;

    var atendMap        = buildAtendMap(dadosPBI);
    var temDados        = dadosPBI && dadosPBI.length > 0;
    var maxAtend        = 0;
    var totalFeatures   = geoCache.features.length;
    var cidadesComDados = Object.keys(atendMap).length;
    var temFiltro       = temDados && cidadesComDados < totalFeatures * 0.5;
    var selecionadas    = temFiltro ? new Set(Object.keys(atendMap)) : null;

    if (temDados) {
      Object.values(atendMap).forEach(function(v) { if (v > maxAtend) maxAtend = v; });
    }

    // ── Polígonos ────────────────────────────────────────────────
    if (geoLayer) map.removeLayer(geoLayer);
    geoLayer = L.geoJSON(geoCache, {
      style: function(feature) {
        var nome  = (feature.properties.name || '').toUpperCase().trim();
        var isSel = !temFiltro || (selecionadas && selecionadas.has(nome));

        if (!temDados) {
          return { color: '#C8D0D8', weight: 0.4, fillColor: '#F5F6F7', fillOpacity: 1 };
        }
        if (temFiltro && !isSel) {
          return { color: '#D0D8E0', weight: 0.3, fillColor: '#F5F6F7', fillOpacity: 0.4 };
        }
        var atend = atendMap[nome] || 0;
        var t = maxAtend > 0 ? Math.sqrt(atend / maxAtend) : 0;
        var r = Math.round(238 + (15  - 238) * t);
        var g = Math.round(242 + (37  - 242) * t);
        var b = Math.round(247 + (73  - 247) * t);
        return { color: '#9BA8B5', weight: 0.4, fillColor: 'rgb('+r+','+g+','+b+')', fillOpacity: 1 };
      },
      onEachFeature: function(feature, lyr) {
        var nome  = feature.properties.name || '';
        var nomeU = nome.toUpperCase().trim();
        var atend = atendMap[nomeU] || 0;
        var tip   = temDados
          ? '<strong>' + nome + '</strong>' + fmt(atend) + ' atendimentos'
          : '<strong>' + nome + '</strong>';
        lyr.bindTooltip(tip, { className: 'tooltip-mapa', sticky: true });
      }
    }).addTo(map);

    bounds = geoLayer.getBounds();
    map.fitBounds(bounds, { padding: [8, 8], animate: false });

    // ── Pins ──────────────────────────────────────────────────────
    if (pinLayer) map.removeLayer(pinLayer);
    pinLayer = L.layerGroup().addTo(map);

    // Pins das cidades com atendimentos
    if (temDados) {
      geoCache.features.forEach(function(f) {
        var nome  = (f.properties.name || '').toUpperCase().trim();
        var atend = atendMap[nome] || 0;
        if (atend === 0) return;
        var isSel = !temFiltro || (selecionadas && selecionadas.has(nome));
        if (!isSel) return;
        if (nome === 'BELO HORIZONTE') return; // BH tem pin especial abaixo

        var t    = maxAtend > 0 ? Math.sqrt(atend / maxAtend) : 0;
        var icon = getPinCidade(t);
        var c    = getCentroid(f);

        L.marker([c.lat, c.lng], { icon: icon, interactive: true, zIndexOffset: 100 })
          .bindTooltip('<strong>' + f.properties.name + '</strong>' + fmt(atend) + ' atendimentos',
            { className: 'tooltip-mapa', sticky: true })
          .addTo(pinLayer);
      });
    }

    // Pin do Hospital da Baleia — sempre presente
    L.marker([HOSPITAL_LAT, HOSPITAL_LNG], {
      icon: PIN_HOSPITAL, interactive: true, zIndexOffset: 1000
    })
    .bindTooltip('<strong>Hospital da Baleia</strong>Belo Horizonte / MG',
      { className: 'tooltip-mapa', sticky: true })
    .addTo(pinLayer);

    // ── Labels ───────────────────────────────────────────────────
    if (labelLayer) map.removeLayer(labelLayer);
    labelLayer = L.layerGroup().addTo(map);

    if (temFiltro) {
      geoCache.features.forEach(function(f) {
        var nome  = f.properties.name || '';
        var nomeU = nome.toUpperCase().trim();
        if (!selecionadas.has(nomeU)) return;
        var c = getCentroid(f);
        L.marker([c.lat, c.lng], {
          icon: L.divIcon({ className: 'lbl-cidade', html: nome, iconSize: null }),
          interactive: false, keyboard: false
        }).addTo(labelLayer);
      });
    }

    setTimeout(reenquadrar, 150);
  }

  window.addEventListener('message', function(event) {
    try {
      var raw = typeof event.data === 'string' ? event.data.trim() : '';
      if (!raw.startsWith('[')) return;
      renderMapa(JSON.parse(raw));
    } catch(e) { console.warn('postMessage error:', e); }
  });

  function tryDataValues() {
    try {
      if (typeof dataValues !== 'undefined' && dataValues && dataValues[0]) {
        var raw = String(dataValues[0]).trim();
        if (raw.startsWith('[')) return JSON.parse(raw);
      }
    } catch(e) {}
    return null;
  }

  fetch(GEOJSON_URL)
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(geo) {
      geoCache = geo;
      // Pré-calcula centroides
      geo.features.forEach(function(f) { getCentroid(f); });
      renderMapa(tryDataValues());
      statusEl.classList.add('hidden');
      setTimeout(reenquadrar, 200);
    })
    .catch(function(err) {
      statusEl.innerHTML =
        '<span style="color:#B23A48">Não foi possível carregar o mapa.</span>' +
        '<span style="font-size:11px">Verifique a conexão com a internet.</span>';
      console.error('GeoJSON error:', err);
    });
})();
</script>
</body>
</html>
